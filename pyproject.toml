[project]
name = "pyResi"
version = "0.2.0"
description = "Unofficial Python client for the Resi Central API (studio.resi.io) — encoders, channels, events, and cue markers."
requires-python = ">=3.14"
dependencies = [
 "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
